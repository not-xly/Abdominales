<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="¡Con ritmo!">
  <meta name="theme-color" content="#e4572e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>¡Con ritmo!</title>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>¡Con ritmo!</h1>
      <div class="top-actions">
        <button id="editBtn" class="ghost" type="button">Periodo</button>
        <button id="resetBtn" class="ghost danger" type="button">Resetear</button>
      </div>
    </div>
    <p class="sub" id="periodLabel"></p>
  </header>

  <section id="setup" class="setup" aria-label="Configurar periodo" hidden>
    <form id="setupForm">
      <h2>Días del periodo</h2>
      <div class="dates">
        <label>Inicio <input type="date" name="start" required></label>
        <label>Final <input type="date" name="end" required></label>
      </div>

      <h2>Ejercicios y objetivo diario</h2>
      <div id="exerciseOptions"></div>

      <p id="setupError" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="setupCancel" class="ghost">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </section>

  <section id="tracking">
    <section id="summary" class="summary" aria-label="Resumen del periodo"></section>
    <main id="days" class="days"></main>
  </section>

  <footer class="legend">Verde: 75 % o más · Rojo: menos del 75 %</footer>

  <script src="app.js"></script>
</body>
</html>
